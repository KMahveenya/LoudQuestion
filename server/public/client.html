<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Rooms</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .container { max-width: 600px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #90EE90; }
        .disconnected { background: #FFB6C1; }
        .room { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 5px; }
        button { margin: 5px; padding: 8px 12px; }
        input { padding: 8px; margin: 5px; }
        #messages { height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Rooms</h1>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div>
            <h3>Rooms Management</h3>
            <input type="text" id="roomInput" placeholder="Room name">
            <button onclick="createRoom()">Create Room</button>
            <button onclick="joinRoom()">Join Room</button>
            <button onclick="leaveRoom()">Leave Room</button>
        </div>

        <div>
            <h3>Available Rooms:</h3>
            <div id="roomsList"></div>
        </div>

        <div>
            <h3>Current Room: <span id="currentRoom">None</span></h3>
            <div id="roomUsers"></div>
        </div>

        <div>
            <h3>Chat</h3>
            <input type="text" id="messageInput" placeholder="Type message">
            <button onclick="sendMessage()">Send</button>
            <div id="messages"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket = null;
        let currentRoom = null;

        function connect() {
            socket = io('http://localhost:3000');

            socket.on('connect', () => {
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = `Connected (ID: ${socket.id})`;
            });

            socket.on('disconnect', () => {
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = 'Disconnected';
                currentRoom = null;
                updateCurrentRoom();
            });

            socket.on('roomCreated', (roomId) => {
                addMessage(`Room "${roomId}" created`);
            });

            socket.on('joinedRoom', (roomId) => {
                currentRoom = roomId;
                updateCurrentRoom();
                addMessage(`Joined room: ${roomId}`);
            });

            socket.on('leftRoom', (roomId) => {
                addMessage(`Left room: ${roomId}`);
                currentRoom = null;
                updateCurrentRoom();
            });

            socket.on('roomsList', (rooms) => {
                const roomsList = document.getElementById('roomsList');
                roomsList.innerHTML = rooms.map(room => 
                    `<div class="room">${room}</div>`
                ).join('');
            });

            socket.on('roomUsers', (data) => {
                if (data.roomId === currentRoom) {
                    document.getElementById('roomUsers').textContent = 
                        `Users in room: ${data.users.length}`;
                }
            });

            socket.on('message', (data) => {
                addMessage(`[${data.roomId}] ${data.from}: ${data.message}`);
            });
        }

        function createRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (roomId && socket) {
                socket.emit('createRoom', roomId);
            }
        }

        function joinRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (roomId && socket) {
                socket.emit('joinRoom', roomId);
            }
        }

        function leaveRoom() {
            if (currentRoom && socket) {
                socket.emit('leaveRoom', currentRoom);
            }
        }

        function sendMessage() {
            const message = document.getElementById('messageInput').value.trim();
            if (message && currentRoom && socket) {
                socket.emit('message', { roomId: currentRoom, message });
                document.getElementById('messageInput').value = '';
            }
        }

        function updateCurrentRoom() {
            document.getElementById('currentRoom').textContent = currentRoom || 'None';
        }

        function addMessage(text) {
            const messages = document.getElementById('messages');
            const message = document.createElement('div');
            message.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        connect();
    </script>
</body>
</html>
